apiVersion: v1
kind: Namespace
metadata:
  name: kanister
  labels:
    app.kubernetes.io/name: kanister-backup-restore
    justrunme.com/role: recovery-plane
---
apiVersion: v1
kind: Secret
metadata:
  name: s3-creds
  namespace: kanister
  labels:
    app.kubernetes.io/name: kanister-backup-restore
type: Opaque
stringData:
  access_key: admin
  secret_key: admin12345
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: seaweedfs-s3-config
  namespace: kanister
data:
  s3.json: |
    {
      "identities": [
        {
          "name": "admin",
          "credentials": [
            {
              "accessKey": "admin",
              "secretKey": "admin12345"
            }
          ],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: kanister
  labels:
    app: seaweedfs
    app.kubernetes.io/name: kanister-backup-restore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:3.85
          args:
            - server
            - -dir=/data
            - -s3
            - -s3.port=8333
            - -s3.config=/etc/seaweedfs/s3.json
            - -master.volumeSizeLimitMB=100
            - -volume.max=1
          ports:
            - containerPort: 8333
              name: s3
            - containerPort: 9333
              name: master
            - containerPort: 8080
              name: volume
          readinessProbe:
            tcpSocket:
              port: 8333
            initialDelaySeconds: 8
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8333
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
            - name: s3-config
              mountPath: /etc/seaweedfs
      volumes:
        - name: data
          emptyDir: {}
        - name: s3-config
          configMap:
            name: seaweedfs-s3-config
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: kanister
spec:
  selector:
    app: seaweedfs
  ports:
    - name: s3
      port: 8333
      targetPort: 8333
---
apiVersion: batch/v1
kind: Job
metadata:
  name: seaweedfs-bootstrap-bucket
  namespace: kanister
  labels:
    app.kubernetes.io/name: kanister-backup-restore
spec:
  ttlSecondsAfterFinished: 120
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: curlimages/curl:8.10.1
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              for i in $(seq 1 60); do
                code="$(curl -s -o /dev/null -m 2 -w '%{http_code}' http://seaweedfs.kanister.svc.cluster.local:8333/ || true)"
                if [ -n "$code" ] && [ "$code" != "000" ]; then
                  echo "s3 endpoint responded HTTP ${code}"
                  break
                fi
                sleep 2
              done
              curl -s -o /dev/null -X PUT http://seaweedfs.kanister.svc.cluster.local:8333/kanister-drills || true
              echo "bucket kanister-drills ready"
---
apiVersion: cr.kanister.io/v1alpha1
kind: Profile
metadata:
  name: s3-profile
  namespace: kanister
  labels:
    app.kubernetes.io/name: kanister-backup-restore
location:
  type: s3Compliant
  bucket: kanister-drills
  endpoint: http://seaweedfs.kanister.svc.cluster.local:8333
  prefix: drills/
  region: us-east-1
credential:
  type: keyPair
  keyPair:
    idField: access_key
    secretField: secret_key
    secret:
      apiVersion: v1
      kind: Secret
      name: s3-creds
      namespace: kanister
skipSSLVerify: true
