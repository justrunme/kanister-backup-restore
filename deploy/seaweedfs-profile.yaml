apiVersion: v1
kind: Namespace
metadata:
  name: kanister
  labels:
    app.kubernetes.io/name: kanister-backup-restore
    justrunme.com/role: recovery-plane
---
apiVersion: v1
kind: Secret
metadata:
  name: s3-creds
  namespace: kanister
  labels:
    app.kubernetes.io/name: kanister-backup-restore
type: Opaque
stringData:
  access_key: admin
  secret_key: admin12345
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3mock
  namespace: kanister
  labels:
    app: s3mock
    app.kubernetes.io/name: kanister-backup-restore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: s3mock
  template:
    metadata:
      labels:
        app: s3mock
    spec:
      containers:
        - name: s3mock
          image: adobe/s3mock:5.2.3
          env:
            - name: initialBuckets
              value: "kanister-drills"
            - name: debug
              value: "false"
          ports:
            - containerPort: 9090
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: 9090
            initialDelaySeconds: 3
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: s3mock
  namespace: kanister
spec:
  selector:
    app: s3mock
  ports:
    - name: http
      port: 9090
      targetPort: 9090
---
apiVersion: batch/v1
kind: Job
metadata:
  name: s3mock-wait
  namespace: kanister
  labels:
    app.kubernetes.io/name: kanister-backup-restore
spec:
  ttlSecondsAfterFinished: 120
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: wait
          image: curlimages/curl:8.10.1
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              for i in $(seq 1 60); do
                if curl -s http://s3mock.kanister.svc.cluster.local:9090/ >/dev/null 2>&1; then
                  echo "s3mock is ready"
                  exit 0
                fi
                sleep 2
              done
              echo "timeout waiting for s3mock"
              exit 1
---
apiVersion: cr.kanister.io/v1alpha1
kind: Profile
metadata:
  name: s3-profile
  namespace: kanister
  labels:
    app.kubernetes.io/name: kanister-backup-restore
location:
  type: s3Compliant
  bucket: kanister-drills
  endpoint: http://s3mock.kanister.svc.cluster.local:9090
  prefix: drills/
  region: us-east-1
credential:
  type: keyPair
  keyPair:
    idField: access_key
    secretField: secret_key
    secret:
      apiVersion: v1
      kind: Secret
      name: s3-creds
      namespace: kanister
skipSSLVerify: true
