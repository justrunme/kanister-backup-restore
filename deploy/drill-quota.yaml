# Apply into a restore-drill-* namespace:
#   kubectl -n "$DRILL_NS" apply -f deploy/drill-quota.yaml
apiVersion: v1
kind: ResourceQuota
metadata:
  name: restore-drill-quota
  labels:
    app.kubernetes.io/name: kanister-backup-restore
    justrunme.com/role: restore-drill
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    requests.storage: 10Gi
    persistentvolumeclaims: "4"
    pods: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: restore-drill-limits
  labels:
    app.kubernetes.io/name: kanister-backup-restore
    justrunme.com/role: restore-drill
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "2"
        memory: 2Gi
