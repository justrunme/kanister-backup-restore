# Recovery Contract operator (kopf).
# Run locally against a cluster:
#   pip install -r operator/requirements.txt
#   RECOVERY_ROOT=$PWD kopf run operator/controller.py --standalone -n kanister
#
# RBAC is least-privilege:
# - ClusterRole for namespace lifecycle only (create drill namespaces)
# - ClusterRole for drill-namespace workloads, bound per-namespace via RoleBinding (not cluster-wide)
# - Role in kanister for secrets/CRs/Kanister resources (no cluster-wide secrets)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: recovery-contract-operator
  namespace: kanister
  labels:
    app.kubernetes.io/name: kanister-backup-restore
---
# Namespace lifecycle only (create/delete drill namespaces).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: recovery-contract-operator-namespaces
  labels:
    app.kubernetes.io/name: kanister-backup-restore
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: recovery-contract-operator-namespaces
  labels:
    app.kubernetes.io/name: kanister-backup-restore
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: recovery-contract-operator-namespaces
subjects:
  - kind: ServiceAccount
    name: recovery-contract-operator
    namespace: kanister
---
# Drill-namespace permissions. Bind with a RoleBinding in each drill/demo ns
# (never via ClusterRoleBinding — that would grant cluster-wide secrets).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: recovery-contract-operator-drill
  labels:
    app.kubernetes.io/name: kanister-backup-restore
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "configmaps", "secrets", "persistentvolumeclaims", "services", "events"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
# Kanister namespace Role: secrets and Kanister/Recovery CRs stay namespaced.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: recovery-contract-operator
  namespace: kanister
  labels:
    app.kubernetes.io/name: kanister-backup-restore
rules:
  - apiGroups: ["recovery.justrunme.com"]
    resources: ["recoverycontracts", "recoverydrills", "recoverydrills/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "configmaps", "secrets", "persistentvolumeclaims", "services", "events"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cr.kanister.io"]
    resources: ["actionsets", "blueprints", "profiles"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: recovery-contract-operator
  namespace: kanister
  labels:
    app.kubernetes.io/name: kanister-backup-restore
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: recovery-contract-operator
subjects:
  - kind: ServiceAccount
    name: recovery-contract-operator
    namespace: kanister
---
# Demo app namespace: bind drill ClusterRole via RoleBinding (namespaced secrets only).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: recovery-contract-operator-drill
  namespace: demo-postgres
  labels:
    app.kubernetes.io/name: kanister-backup-restore
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: recovery-contract-operator-drill
subjects:
  - kind: ServiceAccount
    name: recovery-contract-operator
    namespace: kanister
