name: Demo results

on:
  workflow_dispatch:
  schedule:
    - cron: "37 5 * * 1"

jobs:
  record-drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: |
          python -m pip install asciinema
          npm install -g svg-term-cli
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          chmod +x ./kind && sudo mv ./kind /usr/local/bin/kind
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      - name: Record full recovery drill
        env:
          K8S_VERSION: v1.37.0
        run: |
          mkdir -p docs/assets
          asciinema rec --overwrite -c 'make full-drill' docs/assets/recovery-drill.cast
          svg-term --in docs/assets/recovery-drill.cast --out docs/assets/recovery-drill.svg --window --width 100 --height 24 --no-cursor
          ./scripts/export-metrics.sh
          cp .evidence/recovery-verdict.json docs/results-verdict.json || true
          python3 scripts/write_demo_results.py
      - uses: actions/upload-artifact@v7
        with:
          name: demo-results
          path: |
            docs/assets/recovery-drill.cast
            docs/assets/recovery-drill.svg
            docs/results.json
            .evidence/
            .metrics/
