name: Demo results

on:
  workflow_dispatch:
  schedule:
    - cron: "37 5 * * 1"

permissions:
  contents: read

jobs:
  record-drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        run: |
          set -euo pipefail
          python -m pip install asciinema==2.4.0
          npm install -g svg-term-cli@2.1.1

          KIND_VERSION=v0.33.0
          KIND_SHA256=aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
          curl -fsSL -o kind-linux-amd64 "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  kind-linux-amd64" | sha256sum -c -
          chmod +x kind-linux-amd64 && sudo mv kind-linux-amd64 /usr/local/bin/kind

          KUBECTL_VERSION=v1.37.0
          KUBECTL_SHA256=6129359f4e1f3848a5572ccb0b26cf28b8ca08cef38c95a765b2f64a2c961a2f
          curl -fsSL -o kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  kubectl" | sha256sum -c -
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

          HELM_VERSION=v3.22.1
          HELM_SHA256=896cf63684a42a723d61c980369d6e588330927deb13676ca0d85006dd6da0ea
          curl -fsSL -o "helm-${HELM_VERSION}-linux-amd64.tar.gz" \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm-${HELM_VERSION}-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf "helm-${HELM_VERSION}-linux-amd64.tar.gz"
          sudo mv linux-amd64/helm /usr/local/bin/helm
          rm -rf linux-amd64 "helm-${HELM_VERSION}-linux-amd64.tar.gz"
      - name: Record full recovery drill
        env:
          K8S_VERSION: v1.37.0
        run: |
          mkdir -p docs/assets
          asciinema rec --overwrite -c 'make full-drill' docs/assets/recovery-drill.cast
          svg-term --in docs/assets/recovery-drill.cast --out docs/assets/recovery-drill.svg --window --width 100 --height 24 --no-cursor
          ./scripts/export-metrics.sh
          cp .evidence/recovery-verdict.json docs/results-verdict.json || true
          python3 scripts/write_demo_results.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-results
          path: |
            docs/assets/recovery-drill.cast
            docs/assets/recovery-drill.svg
            docs/results.json
            .evidence/
            .metrics/
