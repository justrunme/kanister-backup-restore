name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract CHANGELOG notes
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {capture=1; next}
            capture && /^## / {exit}
            capture {print}
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "No CHANGELOG section found for [$VERSION]" >&2
            exit 1
          fi

      - name: Build release tarball
        id: tarball
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          NAME="kanister-backup-restore-${VERSION}"
          STAGE="/tmp/${NAME}"
          mkdir -p "$STAGE"
          cp -a deploy scripts config "$STAGE/"
          tar -czf "${NAME}.tar.gz" -C /tmp "$NAME"
          sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          echo "asset=${NAME}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=${NAME}.tar.gz.sha256" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: /tmp/release-notes.md
          files: |
            ${{ steps.tarball.outputs.asset }}
            ${{ steps.tarball.outputs.checksum }}
          fail_on_unmatched_files: true

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          file: ${{ steps.tarball.outputs.asset }}
          format: spdx-json
          artifact-name: kanister-backup-restore-sbom.spdx.json
          output-file: kanister-backup-restore-sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false

      - name: Attach SBOM to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" kanister-backup-restore-sbom.spdx.json --clobber
