name: Recovery Drill

on:
  push:
    branches: [main, feat/recovery-contract]
  pull_request:
  schedule:
    - cron: '17 4 * * *'

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: |
          wget -qO- "https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz" | tar -xJv
          sudo mv shellcheck-v0.10.0/shellcheck /usr/local/bin/
          shellcheck --version
      - name: Run shellcheck
        run: find scripts -name "*.sh" -type f -print0 | xargs -0 shellcheck -e SC1091

  shfmt:
    name: Shell format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install shfmt
        run: |
          wget -qO /usr/local/bin/shfmt "https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64"
          chmod +x /usr/local/bin/shfmt
          shfmt -version
      - name: Check shell formatting
        run: shfmt -d -i 2 -ci -bn scripts/*.sh

  unit-evaluator:
    name: Evaluator unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pytest
        run: python3 -m pip install pytest
      - name: Run unit tests
        working-directory: scripts
        run: python3 -m pytest -q test_evaluate_contract.py test_prove_consistency.py

  recovery-drill:
    name: Recovery Drill (k8s ${{ matrix.k8s }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        k8s:
          - v1.37.0
          - v1.36.4
    steps:
      - uses: actions/checkout@v7

      - name: Install kind
        run: |
          curl -Lo ./kind "https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
          kubectl version --client

      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version

      - name: Run full application recovery drill (happy path)
        env:
          K8S_VERSION: ${{ matrix.k8s }}
        run: make full-drill

      - name: Verify PROVED verdict + consistency
        run: |
          if ! grep -q '"verdict": "PROVED"' .evidence/recovery-verdict.json; then
            echo "Expected PROVED verdict but got:"
            cat .evidence/recovery-verdict.json
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          v = json.loads(Path(".evidence/recovery-verdict.json").read_text())
          ev = json.loads(Path(".evidence/drill-latest.json").read_text())
          assert ev.get("components", {}).get("postgres") is True
          assert ev.get("components", {}).get("s3") is True
          assert ev["checks"].get("cross_component_consistency") is True
          proof = ev.get("proof") or {}
          assert proof.get("rp_id"), "missing rp_id"
          assert (proof.get("recovery_point") or {}).get("generation")
          assert proof.get("backup_sha256")
          loc = ev.get("backup_location") or ""
          assert "pg_backups/" in loc and len(loc.strip("/").split("/")) >= 4
          print("✓ multi-service PROVED with consistency + recovery point")
          PY
          kubectl get recoverycontracts -A
          kubectl get recoverydrills -A
          echo "✓ Application Recovery Contract PROVED"

      - name: Export metrics
        run: |
          ./scripts/export-metrics.sh
          cat .metrics/recovery-contract.prom
          grep -q recovery_last_success_timestamp .metrics/recovery-contract.prom

      - name: Assert secrets absent from kanister job logs
        run: |
          set -euo pipefail
          CHECKED=0
          FOUND=0
          while read -r line; do
            ns="$(echo "$line" | awk '{print $1}')"
            pod="$(echo "$line" | awk '{print $2}')"
            out="$(kubectl -n "$ns" logs "$pod" --tail=200)"
            CHECKED=$((CHECKED + 1))
            if echo "$out" | grep -Eq 'admin12345|PGPASSWORD=|Secret.:.admin'; then
              echo "credential leak in ${ns}/${pod}" >&2
              FOUND=1
            fi
          done < <(kubectl get pods -A --no-headers | awk '/kanister-job/{print $1,$2}')
          if [[ "$CHECKED" -eq 0 ]]; then
            echo "secret-leak check failed: zero kanister-job pods/logs checked" >&2
            exit 1
          fi
          [[ "$FOUND" -eq 0 ]]
          echo "✓ no credential material in kanister job logs (checked ${CHECKED} pods)"

      - name: Failure drill delete-s3-object
        if: matrix.k8s == 'v1.37.0'
        run: make failure-drill SCENARIO=delete-s3-object

      - name: Verify UNPROVED delete-s3-object
        if: matrix.k8s == 'v1.37.0'
        run: |
          set -euo pipefail
          grep -q '"verdict": "UNPROVED"' .evidence/recovery-verdict.json
          grep -q '"reason": "isolated_restore"' .evidence/recovery-verdict.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          ev = json.loads(Path(".evidence/drill-latest.json").read_text())
          assert ev.get("components", {}).get("s3") is False, ev.get("components")
          assert ev["checks"].get("restore_completed") is False
          print("✓ delete-s3-object → UNPROVED isolated_restore; components.s3=False")
          PY

      - name: Failure drill corrupt-s3-object
        if: matrix.k8s == 'v1.37.0'
        run: make failure-drill SCENARIO=corrupt-s3-object

      - name: Verify UNPROVED corrupt-s3-object
        if: matrix.k8s == 'v1.37.0'
        run: |
          grep -q '"verdict": "UNPROVED"' .evidence/recovery-verdict.json
          grep -q '"reason": "cross_component_consistency"' .evidence/recovery-verdict.json
          echo "✓ corrupt-s3-object → UNPROVED consistency"

      - name: Failure drill mismatched-recovery-points
        if: matrix.k8s == 'v1.37.0'
        run: make failure-drill SCENARIO=mismatched-recovery-points

      - name: Verify UNPROVED mismatched-recovery-points
        if: matrix.k8s == 'v1.37.0'
        run: |
          grep -q '"verdict": "UNPROVED"' .evidence/recovery-verdict.json
          grep -q '"reason": "cross_component_consistency"' .evidence/recovery-verdict.json
          echo "✓ mismatched-recovery-points → UNPROVED consistency"

      - name: Dump cluster on failure
        if: failure()
        run: |
          echo "## cluster dump" >> "$GITHUB_STEP_SUMMARY"
          chmod +x scripts/dump-cluster.sh
          ./scripts/dump-cluster.sh | tee /tmp/cluster-dump.txt
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 120 /tmp/cluster-dump.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Stage evidence for upload
        if: always()
        run: |
          mkdir -p /tmp/drill-out
          cp -a .evidence /tmp/drill-out/evidence 2>/dev/null || true
          cp -a .metrics /tmp/drill-out/metrics 2>/dev/null || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: recovery-evidence-k8s-${{ matrix.k8s }}
          path: /tmp/drill-out
          if-no-files-found: warn

      - name: Write job summary
        if: always()
        run: |
          {
            echo "# Application Recovery Drill Results"
            echo ""
            echo "**Kubernetes:** ${{ matrix.k8s }}"
            echo ""
            if [ -f .evidence/recovery-verdict.md ]; then
              cat .evidence/recovery-verdict.md
            else
              echo "❌ No evidence generated"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  operator-kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install kind kubectl
        run: |
          set -euo pipefail
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-amd64
          chmod +x ./kind && sudo mv ./kind /usr/local/bin/kind
          curl -Lo kubectl "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/kubectl
      - name: Create kind cluster
        run: kind create cluster --name recovery-operator
      - name: Install operator deps
        run: pip install -r operator/requirements.txt
      - name: Apply CRDs and RBAC
        run: |
          kubectl create ns kanister
          kubectl create ns demo-postgres
          kubectl apply -f deploy/crds/
          kubectl apply -f deploy/operator.yaml
      - name: Stub drill for operator status path
        run: |
          set -euo pipefail
          cp scripts/app-recovery-drill.sh scripts/app-recovery-drill.sh.bak
          cat > scripts/app-recovery-drill.sh <<'STUB'
          #!/usr/bin/env bash
          set -euo pipefail
          EVIDENCE_DIR="${EVIDENCE_DIR:?}"
          mkdir -p "$EVIDENCE_DIR"
          cat > "$EVIDENCE_DIR/drill-latest.json" <<'JSON'
          {
            "drill_id": 1,
            "scenario": "happy-path",
            "checks": {
              "backup": true,
              "artifact_integrity": true,
              "restore_completed": true,
              "application_health": true,
              "data_verification": true,
              "cross_component_consistency": true,
              "rto_within_target": true,
              "evidence_fresh": true
            },
            "metrics": {
              "component_skew_seconds": 3,
              "rto_seconds": 5,
              "rto_target_seconds": 60,
              "drill_id": 1
            },
            "components": {"postgres": true, "s3": true},
            "collected_at": "2026-10-11T00:00:00Z"
          }
          JSON
          python3 - <<PY
          import json, pathlib
          from datetime import datetime, timezone
          ev_dir = pathlib.Path("${EVIDENCE_DIR}")
          ev = json.loads((ev_dir / "drill-latest.json").read_text())
          (ev_dir / "recovery-verdict.json").write_text(json.dumps({
              "verdict": "PROVED",
              "reason": "",
              "metrics": ev["metrics"],
              "generated_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }, indent=2) + "\n")
          print("stub drill wrote verdict PROVED")
          PY
          STUB
          # expand EVIDENCE_DIR in stub — rewrite with envsubst-like fix
          # The stub above embeds ${EVIDENCE_DIR} inside single-quoted heredoc for the outer file,
          # but the inner python uses a double-quoted path. Fix by using "$EVIDENCE_DIR" in bash only.
          cat > scripts/app-recovery-drill.sh <<'STUB'
          #!/usr/bin/env bash
          set -euo pipefail
          EVIDENCE_DIR="${EVIDENCE_DIR:?}"
          mkdir -p "$EVIDENCE_DIR"
          cat > "$EVIDENCE_DIR/drill-latest.json" <<JSON
          {
            "drill_id": 1,
            "scenario": "happy-path",
            "checks": {
              "backup": true,
              "artifact_integrity": true,
              "restore_completed": true,
              "application_health": true,
              "data_verification": true,
              "cross_component_consistency": true,
              "rto_within_target": true,
              "evidence_fresh": true
            },
            "metrics": {
              "component_skew_seconds": 3,
              "rto_seconds": 5,
              "rto_target_seconds": 60,
              "drill_id": 1
            },
            "components": {"postgres": true, "s3": true},
            "collected_at": "2026-10-11T00:00:00Z"
          }
          JSON
          python3 -c '
          import json, pathlib, os
          from datetime import datetime, timezone
          ev_dir = pathlib.Path(os.environ["EVIDENCE_DIR"])
          ev = json.loads((ev_dir / "drill-latest.json").read_text())
          (ev_dir / "recovery-verdict.json").write_text(json.dumps({
              "verdict": "PROVED",
              "reason": "",
              "metrics": ev["metrics"],
              "generated_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }, indent=2) + "\n")
          print("stub drill wrote verdict PROVED")
          '
          STUB
          chmod +x scripts/app-recovery-drill.sh
          # break.sh must fail the operator if injection fails (check=True)
          cat > scripts/break.sh <<'B'
          #!/usr/bin/env bash
          set -euo pipefail
          echo "break stub ok for $*"
          B
          chmod +x scripts/break.sh
      - name: Start operator
        run: |
          set -euo pipefail
          export RECOVERY_ROOT="$PWD"
          export DRILL_INLINE=1
          export DRILL_POLL_SECONDS=5
          export DRILL_RUNNING_STUCK_SECONDS=120
          export METRICS_PORT=18080
          kopf run operator/controller.py --standalone -n kanister > /tmp/operator.log 2>&1 &
          echo $! > /tmp/operator.pid
          sleep 5
          kill -0 "$(cat /tmp/operator.pid)"
      - name: Create RecoveryDrill and assert status
        run: |
          set -euo pipefail
          kubectl apply -f - <<'YAML'
          apiVersion: recovery.justrunme.com/v1alpha1
          kind: RecoveryDrill
          metadata:
            name: ci-operator-drill
            namespace: kanister
          spec:
            scenario: happy-path
            intervalSeconds: 3600
          YAML
          for i in $(seq 1 60); do
            phase="$(kubectl -n kanister get recoverydrill ci-operator-drill -o jsonpath='{.status.phase}' 2>/dev/null || true)"
            verdict="$(kubectl -n kanister get recoverydrill ci-operator-drill -o jsonpath='{.status.lastVerdict}' 2>/dev/null || true)"
            echo "phase=${phase:-none} verdict=${verdict:-none}"
            if [[ "$phase" == "Succeeded" && "$verdict" == "PROVED" ]]; then
              echo "✓ operator set status phase=Succeeded lastVerdict=PROVED"
              exit 0
            fi
            if [[ "$phase" == "Failed" ]]; then
              kubectl -n kanister get recoverydrill ci-operator-drill -o yaml
              cat /tmp/operator.log || true
              exit 1
            fi
            sleep 2
          done
          echo "timed out waiting for operator status" >&2
          kubectl -n kanister get recoverydrill ci-operator-drill -o yaml || true
          cat /tmp/operator.log || true
          exit 1
