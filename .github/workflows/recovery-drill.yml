name: Recovery Drill

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * *'

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install shellcheck
        run: |
          wget -qO- "https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz" | tar -xJv
          sudo mv shellcheck-v0.10.0/shellcheck /usr/local/bin/
          shellcheck --version
      
      - name: Run shellcheck
        run: |
          find scripts -name "*.sh" -type f -print0 | xargs -0 shellcheck -e SC1091

  shfmt:
    name: Shell format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install shfmt
        run: |
          wget -qO /usr/local/bin/shfmt "https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64"
          chmod +x /usr/local/bin/shfmt
          shfmt -version
      
      - name: Check shell formatting
        run: |
          shfmt -d -i 2 -ci -bn scripts/*.sh

  recovery-drill:
    name: Recovery Drill (k8s ${{ matrix.k8s }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        k8s:
          - v1.37.0
          - v1.36.4
    steps:
      - uses: actions/checkout@v4
      
      - name: Install kind
        run: |
          curl -Lo ./kind "https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version
      
      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
          kubectl version --client
      
      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version
      
      - name: Run full recovery drill (happy path)
        env:
          K8S_VERSION: ${{ matrix.k8s }}
        run: |
          make full-drill
      
      - name: Verify PROVED verdict
        run: |
          if ! grep -q '"verdict": "PROVED"' .evidence/recovery-verdict.json; then
            echo "Expected PROVED verdict but got:"
            cat .evidence/recovery-verdict.json
            exit 1
          fi
          echo "✓ Recovery Contract PROVED"
      
      - name: Export metrics
        run: |
          ./scripts/export-metrics.sh
          cat .metrics/recovery-contract.prom
      
      - name: Run failure drill (corrupt-artifact)
        run: |
          make failure-drill SCENARIO=corrupt-artifact
      
      - name: Verify UNPROVED verdict for failure drill
        run: |
          if ! grep -q '"verdict": "UNPROVED"' .evidence/recovery-verdict.json; then
            echo "Expected UNPROVED verdict for corrupt-artifact but got:"
            cat .evidence/recovery-verdict.json
            exit 1
          fi
          if ! grep -q '"reason": "artifact_integrity"' .evidence/recovery-verdict.json; then
            echo "Expected reason: artifact_integrity but got:"
            cat .evidence/recovery-verdict.json
            exit 1
          fi
          echo "✓ Failure drill correctly detected corrupted artifact"
      
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-evidence-k8s-${{ matrix.k8s }}
          path: |
            .evidence/
            .metrics/
      
      - name: Write job summary
        if: always()
        run: |
          {
            echo "# Recovery Drill Results"
            echo ""
            echo "**Kubernetes:** ${{ matrix.k8s }}"
            echo ""
            if [ -f .evidence/recovery-verdict.md ]; then
              cat .evidence/recovery-verdict.md
            else
              echo "❌ No evidence generated"
            fi
            echo ""
            echo "## Metrics"
            echo ""
            echo '```'
            if [ -f .metrics/recovery-contract.prom ]; then
              cat .metrics/recovery-contract.prom
            else
              echo "No metrics generated"
            fi
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
