apiVersion: v1
kind: Namespace
metadata:
  name: demo-postgres
  labels:
    app.kubernetes.io/name: kanister-backup-restore
    justrunme.com/role: demo-app
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: demo-postgres
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: demo-change-me
  POSTGRES_DB: app
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: demo-postgres
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: demo-postgres
  labels:
    app: postgres
    app.kubernetes.io/name: kanister-backup-restore
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: postgres-credentials
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
