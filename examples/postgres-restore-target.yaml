# Empty Postgres target for RESTORE drills — no seed initdb, no seed Job.
# Data must come only from the restored backup artifact.
apiVersion: v1
kind: Namespace
metadata:
  name: restore-target
  labels:
    app.kubernetes.io/name: kanister-backup-restore
    justrunme.com/role: restore-drill
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: restore-target
  labels:
    app.kubernetes.io/name: kanister-backup-restore
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: demo-change-me
  POSTGRES_DB: app
  PGPASSWORD: demo-change-me
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: restore-target
  labels:
    app: postgres
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: restore-target
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: restore-target
  labels:
    app: postgres
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: restore-target
    app.kubernetes.io/part-of: kanister-backup-restore
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        app.kubernetes.io/name: postgres
        app.kubernetes.io/instance: restore-target
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: postgres-credentials
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 15
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
