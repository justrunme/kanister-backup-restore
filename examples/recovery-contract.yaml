apiVersion: recovery.justrunme.com/v1alpha1
kind: RecoveryContract
metadata:
  name: app-postgres-s3
  namespace: kanister
  labels:
    app.kubernetes.io/name: kanister-backup-restore
spec:
  targets:
    - component: postgres
      kind: StatefulSet
      name: postgres
      namespace: demo-postgres
    - component: s3
      kind: Bucket
      name: kanister-drills
      namespace: kanister
  rtoSecondsMax: 60
  rpoSecondsMax: 300
  evidenceTTLHours: 24
  recoveryPointSkewSecondsMax: 60
  schedule: "17 4 * * *"
---
apiVersion: recovery.justrunme.com/v1alpha1
kind: RecoveryDrill
metadata:
  name: nightly-app-drill
  namespace: kanister
  labels:
    app.kubernetes.io/name: kanister-backup-restore
spec:
  contractRef: app-postgres-s3
  scenario: happy-path
  suspend: true
