apiVersion: cr.kanister.io/v1alpha1
kind: Blueprint
metadata:
  name: postgres-app-aware
  namespace: kanister
  labels:
    app.kubernetes.io/name: kanister-backup-restore
    app.kubernetes.io/component: blueprint
    justrunme.com/workload: postgres
actions:
  backup:
    kind: StatefulSet
    outputArtifacts:
      cloudObject:
        keyValue:
          backupLocation: "{{ .Phases.pgDump.Output.backupLocation }}"
          backupSha256: "{{ .Phases.pgDump.Output.backupSha256 }}"
          backupBytes: "{{ .Phases.pgDump.Output.backupBytes }}"
          backupTimestamp: "{{ .Phases.pgDump.Output.backupTimestamp }}"
          namespace: "{{ .StatefulSet.Namespace }}"
          name: "{{ .StatefulSet.Name }}"
    phases:
      - func: KubeTask
        name: pgDump
        objects:
          pgSecret:
            kind: Secret
            name: postgres-credentials
            namespace: "{{ .StatefulSet.Namespace }}"
        args:
          image: ghcr.io/kanisterio/postgres-kanister-tools:0.118.0
          namespace: "{{ .StatefulSet.Namespace }}"
          command:
            - bash
            - -o
            - errexit
            - -o
            - pipefail
            - -c
            - |
              set -euo pipefail
              export AWS_EC2_METADATA_DISABLED=true
              export PGHOST="postgres.{{ .StatefulSet.Namespace }}.svc.cluster.local"
              export PGPORT="5432"
              export PGUSER='{{ index .Phases.pgDump.Secrets.pgSecret.Data "POSTGRES_USER" | toString }}'
              export PGPASSWORD='{{ index .Phases.pgDump.Secrets.pgSecret.Data "POSTGRES_PASSWORD" | toString }}'
              export PGDATABASE='{{ index .Phases.pgDump.Secrets.pgSecret.Data "POSTGRES_DB" | toString }}'
              RUN_ID="$(date -u +%Y%m%dT%H%M%SZ)-$(cat /proc/sys/kernel/random/uuid 2>/dev/null || od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
              BACKUP_TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              BACKUP_LOCATION="pg_backups/{{ .StatefulSet.Namespace }}/{{ .StatefulSet.Name }}/${RUN_ID}/backup.sql.gz"
              echo "START backup host=${PGHOST} db=${PGDATABASE} path=${BACKUP_LOCATION}"
              pg_dump --clean --if-exists -U "${PGUSER}" "${PGDATABASE}" | gzip -c > /tmp/backup.sql.gz
              BYTES="$(wc -c < /tmp/backup.sql.gz | tr -d ' ')"
              SHA256="$(sha256sum /tmp/backup.sql.gz | awk '{print $1}')"
              echo "dump bytes=${BYTES} sha256=${SHA256}"
              if ! kando location push /tmp/backup.sql.gz --profile '{{ toJson .Profile }}' --path "${BACKUP_LOCATION}" > /tmp/kando.out 2>&1; then
                echo "kando push failed"
                grep -iE 'error|fail|denied|unable|invalid|missing|forbidden|connect' /tmp/kando.out || tail -20 /tmp/kando.out
                exit 1
              fi
              # Do not dump full kando output (may contain profile material).
              echo "kando push ok"
              kando output backupLocation "${BACKUP_LOCATION}"
              kando output backupSha256 "${SHA256}"
              kando output backupBytes "${BYTES}"
              kando output backupTimestamp "${BACKUP_TS}"

  validate:
    kind: StatefulSet
    inputArtifactNames:
      - cloudObject
    phases:
      - func: KubeTask
        name: checkArtifact
        objects:
          pgSecret:
            kind: Secret
            name: postgres-credentials
            namespace: "{{ .StatefulSet.Namespace }}"
        args:
          image: ghcr.io/kanisterio/postgres-kanister-tools:0.118.0
          namespace: "{{ .StatefulSet.Namespace }}"
          command:
            - bash
            - -o
            - errexit
            - -o
            - pipefail
            - -c
            - |
              set -euo pipefail
              export AWS_EC2_METADATA_DISABLED=true
              export PGHOST="postgres.{{ .StatefulSet.Namespace }}.svc.cluster.local"
              export PGPORT="5432"
              export PGUSER='{{ index .Phases.checkArtifact.Secrets.pgSecret.Data "POSTGRES_USER" | toString }}'
              export PGPASSWORD='{{ index .Phases.checkArtifact.Secrets.pgSecret.Data "POSTGRES_PASSWORD" | toString }}'
              BACKUP_LOCATION='{{ .ArtifactsIn.cloudObject.KeyValue.backupLocation }}'
              EXPECTED_SHA='{{ .ArtifactsIn.cloudObject.KeyValue.backupSha256 }}'
              echo "START validate path=${BACKUP_LOCATION}"
              if ! kando location pull /tmp/backup.sql.gz --profile '{{ toJson .Profile }}' --path "${BACKUP_LOCATION}" > /tmp/kando.out 2>&1; then
                echo "kando pull failed"
                grep -iE 'error|fail|denied|unable|invalid|missing|forbidden|connect' /tmp/kando.out || tail -20 /tmp/kando.out
                exit 1
              fi
              ACTUAL_SHA="$(sha256sum /tmp/backup.sql.gz | awk '{print $1}')"
              echo "sha256 actual=${ACTUAL_SHA} expected=${EXPECTED_SHA}"
              if [[ -z "${EXPECTED_SHA}" || "${EXPECTED_SHA}" == "<no value>" ]]; then
                echo "missing backupSha256 artifact metadata" >&2
                exit 1
              fi
              if [[ "${ACTUAL_SHA}" != "${EXPECTED_SHA}" ]]; then
                echo "sha256 mismatch" >&2
                exit 1
              fi
              gzip -t /tmp/backup.sql.gz
              # Real integrity: restore plain SQL dump into a scratch database.
              for i in $(seq 1 60); do
                if pg_isready -h "${PGHOST}" -p "${PGPORT}" -U "${PGUSER}"; then
                  break
                fi
                sleep 2
              done
              SCRATCH="validate_scratch_$$"
              psql -v ON_ERROR_STOP=1 -w -h "${PGHOST}" -U "${PGUSER}" -d postgres \
                -c "DROP DATABASE IF EXISTS ${SCRATCH};" \
                -c "CREATE DATABASE ${SCRATCH};"
              gunzip -c -f /tmp/backup.sql.gz \
                | grep -v -E 'transaction_timeout' \
                | psql -v ON_ERROR_STOP=1 -w -h "${PGHOST}" -U "${PGUSER}" -d "${SCRATCH}"
              # Confirm a seeded table exists after restore into scratch.
              ROWS="$(psql -w -h "${PGHOST}" -U "${PGUSER}" -d "${SCRATCH}" -tAc \
                "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public';")"
              psql -v ON_ERROR_STOP=1 -w -h "${PGHOST}" -U "${PGUSER}" -d postgres \
                -c "DROP DATABASE IF EXISTS ${SCRATCH};"
              if [[ -z "${ROWS}" || "${ROWS}" -lt 1 ]]; then
                echo "scratch restore produced no public tables" >&2
                exit 1
              fi
              echo "validation ok (sha256 + scratch restore, tables=${ROWS})"

  restore:
    kind: StatefulSet
    inputArtifactNames:
      - cloudObject
    phases:
      - func: KubeTask
        name: pgRestore
        objects:
          pgSecret:
            kind: Secret
            name: postgres-credentials
            namespace: "{{ .StatefulSet.Namespace }}"
        args:
          image: ghcr.io/kanisterio/postgres-kanister-tools:0.118.0
          namespace: "{{ .StatefulSet.Namespace }}"
          command:
            - bash
            - -o
            - errexit
            - -o
            - pipefail
            - -c
            - |
              set -euo pipefail
              export AWS_EC2_METADATA_DISABLED=true
              export PGHOST="postgres.{{ .StatefulSet.Namespace }}.svc.cluster.local"
              export PGPORT="5432"
              export PGUSER='{{ index .Phases.pgRestore.Secrets.pgSecret.Data "POSTGRES_USER" | toString }}'
              export PGPASSWORD='{{ index .Phases.pgRestore.Secrets.pgSecret.Data "POSTGRES_PASSWORD" | toString }}'
              export PGDATABASE='{{ index .Phases.pgRestore.Secrets.pgSecret.Data "POSTGRES_DB" | toString }}'
              BACKUP_LOCATION='{{ .ArtifactsIn.cloudObject.KeyValue.backupLocation }}'
              EXPECTED_SHA='{{ .ArtifactsIn.cloudObject.KeyValue.backupSha256 }}'
              echo "START restore path=${BACKUP_LOCATION} host=${PGHOST}"
              for i in $(seq 1 60); do
                if pg_isready -h "${PGHOST}" -p "${PGPORT}" -U "${PGUSER}"; then
                  break
                fi
                sleep 2
              done
              pg_isready -h "${PGHOST}" -p "${PGPORT}" -U "${PGUSER}"
              if ! kando location pull /tmp/backup.sql.gz --profile '{{ toJson .Profile }}' --path "${BACKUP_LOCATION}" > /tmp/kando.out 2>&1; then
                echo "kando pull failed"
                grep -iE 'error|fail|denied|unable|invalid|missing|forbidden|connect' /tmp/kando.out || tail -20 /tmp/kando.out
                exit 1
              fi
              ACTUAL_SHA="$(sha256sum /tmp/backup.sql.gz | awk '{print $1}')"
              if [[ -n "${EXPECTED_SHA}" && "${EXPECTED_SHA}" != "<no value>" && "${ACTUAL_SHA}" != "${EXPECTED_SHA}" ]]; then
                echo "sha256 mismatch on restore: actual=${ACTUAL_SHA} expected=${EXPECTED_SHA}" >&2
                exit 1
              fi
              gunzip -c -f /tmp/backup.sql.gz \
                | grep -v -E 'transaction_timeout' \
                | psql -v ON_ERROR_STOP=1 -w -h "${PGHOST}" -U "${PGUSER}" -d "${PGDATABASE}"
              echo "restore complete"

  delete:
    kind: StatefulSet
    inputArtifactNames:
      - cloudObject
    phases:
      - func: KubeTask
        name: deleteDump
        args:
          image: ghcr.io/kanisterio/postgres-kanister-tools:0.118.0
          namespace: "{{ .StatefulSet.Namespace }}"
          command:
            - bash
            - -o
            - errexit
            - -o
            - pipefail
            - -c
            - |
              set -euo pipefail
              BACKUP_LOCATION='{{ .ArtifactsIn.cloudObject.KeyValue.backupLocation }}'
              echo "deleting ${BACKUP_LOCATION}"
              kando location delete --profile '{{ toJson .Profile }}' --path "${BACKUP_LOCATION}"
              echo "delete complete"
