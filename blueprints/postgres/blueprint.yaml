apiVersion: cr.kanister.io/v1alpha1
kind: Blueprint
metadata:
  name: postgres-app-aware
  labels:
    app.kubernetes.io/name: kanister-backup-restore
    app.kubernetes.io/component: blueprint
    justrunme.com/workload: postgres
actions:
  backup:
    kind: StatefulSet
    outputArtifacts:
      cloudObject:
        keyValue:
          backupLocation: "{{ .Phases.pgDump.Output.backupLocation }}"
          namespace: "{{ .StatefulSet.Namespace }}"
          name: "{{ .StatefulSet.Name }}"
    phases:
      - func: KubeTask
        name: pgDump
        objects:
          pgSecret:
            kind: Secret
            name: postgres-credentials
            namespace: "{{ .StatefulSet.Namespace }}"
        args:
          image: ghcr.io/kanisterio/postgres-kanister-tools:0.118.0
          namespace: "{{ .StatefulSet.Namespace }}"
          command:
            - bash
            - -o
            - errexit
            - -o
            - pipefail
            - -c
            - |
              set -euo pipefail
              export PGHOST="postgres.{{ .StatefulSet.Namespace }}.svc.cluster.local"
              export PGPORT="5432"
              export PGUSER='{{ index .Phases.pgDump.Secrets.pgSecret.Data "POSTGRES_USER" | toString }}'
              export PGPASSWORD='{{ index .Phases.pgDump.Secrets.pgSecret.Data "POSTGRES_PASSWORD" | toString }}'
              export PGDATABASE='{{ index .Phases.pgDump.Secrets.pgSecret.Data "POSTGRES_DB" | toString }}'
              BACKUP_LOCATION="pg_backups/{{ .StatefulSet.Namespace }}/{{ .StatefulSet.Name }}/{{ toDate "2006-01-02T15:04:05.999999999Z07:00" .Time | date "2006-01-02T15:04:05Z07:00" }}/backup.sql.gz"
              echo "pg_dump host=${PGHOST} db=${PGDATABASE} -> ${BACKUP_LOCATION}"
              pg_dump --clean --if-exists -U "${PGUSER}" "${PGDATABASE}" \
                | gzip -c \
                | kando location push --profile '{{ toJson .Profile }}' --path "${BACKUP_LOCATION}" -
              kando output backupLocation "${BACKUP_LOCATION}"

  validate:
    kind: StatefulSet
    inputArtifactNames:
      - cloudObject
    phases:
      - func: KubeTask
        name: checkArtifact
        args:
          image: ghcr.io/kanisterio/postgres-kanister-tools:0.118.0
          namespace: "{{ .StatefulSet.Namespace }}"
          command:
            - bash
            - -o
            - errexit
            - -o
            - pipefail
            - -c
            - |
              set -euo pipefail
              BACKUP_LOCATION='{{ .ArtifactsIn.cloudObject.KeyValue.backupLocation }}'
              echo "validating artifact ${BACKUP_LOCATION}"
              kando location pull --profile '{{ toJson .Profile }}' --path "${BACKUP_LOCATION}" - \
                | gzip -t
              echo "gzip integrity ok"
              # Sample first bytes after gunzip to ensure SQL dump, not empty/corrupt object
              HEAD="$(kando location pull --profile '{{ toJson .Profile }}' --path "${BACKUP_LOCATION}" - | gunzip -c | head -c 64 | tr -d '\0' || true)"
              echo "dump head: ${HEAD}"
              echo "${HEAD}" | grep -Eqi 'postgres|create|drop|set |--'
              echo "validation ok"

  restore:
    kind: StatefulSet
    inputArtifactNames:
      - cloudObject
    phases:
      - func: KubeTask
        name: pgRestore
        objects:
          pgSecret:
            kind: Secret
            name: postgres-credentials
            namespace: "{{ .StatefulSet.Namespace }}"
        args:
          image: ghcr.io/kanisterio/postgres-kanister-tools:0.118.0
          namespace: "{{ .StatefulSet.Namespace }}"
          command:
            - bash
            - -o
            - errexit
            - -o
            - pipefail
            - -c
            - |
              set -euo pipefail
              export PGHOST="postgres.{{ .StatefulSet.Namespace }}.svc.cluster.local"
              export PGPORT="5432"
              export PGUSER='{{ index .Phases.pgRestore.Secrets.pgSecret.Data "POSTGRES_USER" | toString }}'
              export PGPASSWORD='{{ index .Phases.pgRestore.Secrets.pgSecret.Data "POSTGRES_PASSWORD" | toString }}'
              export PGDATABASE='{{ index .Phases.pgRestore.Secrets.pgSecret.Data "POSTGRES_DB" | toString }}'
              BACKUP_LOCATION='{{ .ArtifactsIn.cloudObject.KeyValue.backupLocation }}'
              echo "restoring ${BACKUP_LOCATION} -> ${PGHOST}/${PGDATABASE}"
              # Wait until Postgres accepts connections in the target namespace
              for i in $(seq 1 60); do
                if pg_isready -h "${PGHOST}" -p "${PGPORT}" -U "${PGUSER}"; then
                  break
                fi
                sleep 2
              done
              pg_isready -h "${PGHOST}" -p "${PGPORT}" -U "${PGUSER}"
              kando location pull --profile '{{ toJson .Profile }}' --path "${BACKUP_LOCATION}" - \
                | gunzip -c -f \
                | psql -v ON_ERROR_STOP=1 -h "${PGHOST}" -U "${PGUSER}" -d "${PGDATABASE}"
              echo "restore complete"

  delete:
    kind: StatefulSet
    inputArtifactNames:
      - cloudObject
    phases:
      - func: KubeTask
        name: deleteDump
        args:
          image: ghcr.io/kanisterio/postgres-kanister-tools:0.118.0
          namespace: "{{ .StatefulSet.Namespace }}"
          command:
            - bash
            - -o
            - errexit
            - -o
            - pipefail
            - -c
            - |
              set -euo pipefail
              BACKUP_LOCATION='{{ .ArtifactsIn.cloudObject.KeyValue.backupLocation }}'
              echo "deleting ${BACKUP_LOCATION}"
              kando location delete --profile '{{ toJson .Profile }}' --path "${BACKUP_LOCATION}"
              echo "delete complete"
