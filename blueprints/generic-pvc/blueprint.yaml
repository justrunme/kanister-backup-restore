apiVersion: cr.kanister.io/v1alpha1
kind: Blueprint
metadata:
  name: generic-pvc-app-aware
  labels:
    app.kubernetes.io/name: kanister-backup-restore
    app.kubernetes.io/component: blueprint
    justrunme.com/workload: generic-pvc
actions:
  backup:
    kind: Deployment
    outputArtifacts:
      cloudObject:
        keyValue:
          backupLocation: "{{ .Phases.fsBackup.Output.backupLocation }}"
          namespace: "{{ .Deployment.Namespace }}"
          name: "{{ .Deployment.Name }}"
    phases:
      - func: KubeTask
        name: fsBackup
        args:
          image: ghcr.io/kanisterio/kanister-tools:0.118.0
          namespace: "{{ .Deployment.Namespace }}"
          # Attach the same claim the app uses via pod volume in ActionSet options when needed.
          # Default drill uses a data path materialized by examples/file-app.
          command:
            - bash
            - -o
            - errexit
            - -o
            - pipefail
            - -c
            - |
              set -euo pipefail
              DATA_DIR="${DATA_DIR:-/data}"
              BACKUP_LOCATION="pvc_backups/{{ .Deployment.Namespace }}/{{ .Deployment.Name }}/{{ toDate "2006-01-02T15:04:05.999999999Z07:00" .Time | date "2006-01-02T15:04:05Z07:00" }}/data.tar.gz"
              echo "filesystem backup ${DATA_DIR} -> ${BACKUP_LOCATION}"
              if [[ ! -d "${DATA_DIR}" ]]; then
                echo "DATA_DIR ${DATA_DIR} missing in task pod — mount PVC or use file-app example" >&2
                exit 1
              fi
              tar -C "${DATA_DIR}" -czf - . \
                | kando location push --profile '{{ toJson .Profile }}' --path "${BACKUP_LOCATION}" -
              kando output backupLocation "${BACKUP_LOCATION}"

  validate:
    kind: Deployment
    inputArtifactNames:
      - cloudObject
    phases:
      - func: KubeTask
        name: checkArtifact
        args:
          image: ghcr.io/kanisterio/kanister-tools:0.118.0
          namespace: "{{ .Deployment.Namespace }}"
          command:
            - bash
            - -o
            - errexit
            - -o
            - pipefail
            - -c
            - |
              set -euo pipefail
              BACKUP_LOCATION='{{ .ArtifactsIn.cloudObject.KeyValue.backupLocation }}'
              echo "validating ${BACKUP_LOCATION}"
              kando location pull --profile '{{ toJson .Profile }}' --path "${BACKUP_LOCATION}" - | gzip -t
              echo "validation ok"

  restore:
    kind: Deployment
    inputArtifactNames:
      - cloudObject
    phases:
      - func: KubeTask
        name: fsRestore
        args:
          image: ghcr.io/kanisterio/kanister-tools:0.118.0
          namespace: "{{ .Deployment.Namespace }}"
          command:
            - bash
            - -o
            - errexit
            - -o
            - pipefail
            - -c
            - |
              set -euo pipefail
              DATA_DIR="${DATA_DIR:-/data}"
              BACKUP_LOCATION='{{ .ArtifactsIn.cloudObject.KeyValue.backupLocation }}'
              mkdir -p "${DATA_DIR}"
              echo "restoring ${BACKUP_LOCATION} -> ${DATA_DIR}"
              kando location pull --profile '{{ toJson .Profile }}' --path "${BACKUP_LOCATION}" - \
                | tar -C "${DATA_DIR}" -xzf -
              echo "restore complete"

  delete:
    kind: Deployment
    inputArtifactNames:
      - cloudObject
    phases:
      - func: KubeTask
        name: deleteArtifact
        args:
          image: ghcr.io/kanisterio/kanister-tools:0.118.0
          namespace: "{{ .Deployment.Namespace }}"
          command:
            - bash
            - -o
            - errexit
            - -c
            - |
              set -euo pipefail
              BACKUP_LOCATION='{{ .ArtifactsIn.cloudObject.KeyValue.backupLocation }}'
              kando location delete --profile '{{ toJson .Profile }}' --path "${BACKUP_LOCATION}"
