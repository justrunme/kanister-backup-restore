# Example cloud Profile (AWS S3 / GCS interoperable endpoint).
# For Kind drills prefer deploy/minio-profile.yaml (applied by `make minio`).
apiVersion: v1
kind: Secret
metadata:
  name: s3-creds
  namespace: kanister
type: Opaque
stringData:
  access_key: "CHANGE_ME"
  secret_key: "CHANGE_ME"
---
apiVersion: cr.kanister.io/v1alpha1
kind: Profile
metadata:
  name: s3-profile
  namespace: kanister
location:
  type: s3Compliant
  bucket: your-kanister-bucket
  endpoint: "" # leave empty for AWS; set for MinIO/GCS XML API
  prefix: production/
  region: eu-central-1
credential:
  type: keyPair
  keyPair:
    idField: access_key
    secretField: secret_key
    secret:
      apiVersion: v1
      kind: Secret
      name: s3-creds
      namespace: kanister
skipSSLVerify: false
