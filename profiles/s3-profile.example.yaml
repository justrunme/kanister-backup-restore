# Example Kanister Profile for S3-compatible object storage.
# Copy to s3-profile.yaml and fill secrets before `make apply-profile`.
apiVersion: v1
kind: Secret
metadata:
  name: kanister-s3-secret
  namespace: kanister
type: Opaque
stringData:
  # aws access key id / secret for S3 or MinIO
  access_key: "CHANGE_ME"
  secret_key: "CHANGE_ME"
---
apiVersion: cr.kanister.io/v1alpha1
kind: Profile
metadata:
  name: s3-profile
  namespace: kanister
  labels:
    app.kubernetes.io/name: kanister-backup-restore
location:
  type: s3Compliant
  bucket: kanister-drills
  endpoint: ""   # e.g. http://minio.kanister.svc:9000 for in-cluster MinIO
  prefix: drills/
  region: us-east-1
credential:
  type: keyPair
  keyPair:
    idField: access_key
    secretField: secret_key
    secret:
      apiVersion: v1
      kind: Secret
      name: kanister-s3-secret
      namespace: kanister
skipSSLVerify: true
